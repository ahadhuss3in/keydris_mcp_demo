[project]
name = "keydris-demo-mcp"
version = "0.1.0"
description = "Governed SecOps Agent PoC: LangGraph + Jev AI + Keydris-gated MCP enforcement"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.5",
    "langchain>=1.4.2",
    "langchain-openai>=1.0.0",
    "langgraph>=1.2.12",
    "httpx>=0.28",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"